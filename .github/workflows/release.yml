# A release, of a commit on main with a version tag (pnpm release <version>
# makes both and pushes them together; decision 0051). It starts once the Check
# workflow has passed on that commit, so lint, typecheck and the tests run once,
# there, and nothing is built from a commit that failed them. Check failed (a
# flaky test, say)? Re-run it: once it passes, this starts.
#
#   tag     the commit's version tag, if it has one (none: nothing to do), and
#           that it is the app's version
#   draft   a draft GitHub release for the tag, with notes from the commits
#           (a pre-release for a tag like v1.2.0-beta.1, which installed apps
#           never update to)
#   build   macOS (Apple silicon and Intel), Windows and Linux, each signed and
#           added to the draft, in the `release` environment, which holds the
#           signing secrets
#   server  the server as released (decision 0052), signed with the release
#           key, added to the draft
#   publish the draft, once everything is in it: installed apps, and servers
#           run with --auto-update, update to it within hours (they look only
#           at the latest published release). If a build fails, the draft
#           stays a draft.
name: Release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    # Check passed, on a push to main (not a pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: The commit's version tag, if any, is the app's version
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A tag made with -a points at a tag object; its line ending ^{} names the commit.
          tag=$(git ls-remote --tags origin 'v*' | awk -v s="$SHA" '$1 == s { n = $2; sub("refs/tags/", "", n); sub(/\^\{\}$/, "", n); print n }' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "No version tag on $SHA: nothing to release."
            exit 0
          fi
          v=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$v" != "$tag" ]; then
            echo "::error::The tag is $tag, but apps/desktop/package.json says $v. Make releases with pnpm release <version>."
            exit 1
          fi
          echo "Releasing $tag ($SHA)."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Each job after this one is given the tag (TAG): the ref this runs on is main, not the tag.
  draft:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      # Made once, here: the three builds each add to it, rather than each making one.
      - name: A draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "Kuraa ${TAG#v}" $pre

  build:
    needs: [tag, draft]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current macOS image (GitHub retires older ones), Apple silicon; it builds for Intel too.
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # Where the app built looks for updates, and where electron-builder adds the builds.
      KURAA_UPDATES: github:${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apple's API key, as the file notarizing reads
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Build for macOS, signed and notarized
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @kuraa/desktop release:mac

      - name: Build for Windows, signed with Azure Trusted Signing
        if: matrix.platform == 'win'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: pnpm --filter @kuraa/desktop release:win

      # The .rpm is made with rpmbuild (the .deb and the AppImage need nothing more).
      - name: rpmbuild, for the .rpm
        if: matrix.platform == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm

      - name: Build for Linux
        if: matrix.platform == 'linux'
        run: pnpm --filter @kuraa/desktop release:linux

  # The server's release key is used in jobs of its own (0112), with no checkout and nothing installed: no dependency's
  # code runs where the key is. One says the public key, which the build (no secret) puts in the server; another
  # signs the archive the build made.
  server-key:
    needs: [tag, draft]
    environment: release
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.public.outputs.pem }}
    steps:
      - name: The release key's public half
        id: public
        env:
          SERVER_SIGNING_KEY: ${{ secrets.SERVER_SIGNING_KEY }}
        run: |
          node -e '
            const { createPrivateKey, createPublicKey } = require("node:crypto");
            const pem = createPublicKey(createPrivateKey(process.env.SERVER_SIGNING_KEY)).export({ type: "spki", format: "pem" }).toString();
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "pem<<EOF\n" + pem + "EOF\n");
          '

  server:
    needs: [tag, draft, server-key]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - name: Build the server, with the release key's public half in it (signed in the next job)
        env:
          KURAA_UPDATES: github:${{ github.repository }}
          SERVER_PUBLIC_KEY: ${{ needs.server-key.outputs.public }}
        run: node scripts/build-server.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server
          path: dist/server/kuraa-server-*.tar.gz
          if-no-files-found: error

  server-sign:
    needs: [tag, server]
    environment: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server
          path: server
      - name: Sign the server with the release key
        env:
          SERVER_SIGNING_KEY: ${{ secrets.SERVER_SIGNING_KEY }}
        run: |
          node -e '
            const { createPrivateKey, sign } = require("node:crypto");
            const fs = require("node:fs");
            const key = createPrivateKey(process.env.SERVER_SIGNING_KEY);
            const files = fs.readdirSync("server").filter((f) => f.endsWith(".tar.gz"));
            if (files.length !== 1) throw new Error("expected one archive, found " + files.length);
            const file = "server/" + files[0];
            fs.writeFileSync(file + ".sig", sign(null, fs.readFileSync(file), key).toString("base64") + "\n");
          '
      - name: Add it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" server/kuraa-server-*.tar.gz*

  publish:
    needs: [tag, build, server-sign]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
