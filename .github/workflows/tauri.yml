# The Tauri app (decision 0127), on every push to main and every pull request:
# built on each platform it ships on (macOS, Windows, Linux: the system's webview
# each, WKWebView, WebView2, WebKitGTK), and on macOS driven by its desktop tests
# (tauri.spec.ts). Unsigned, and not released: a workflow of its own, which no
# release waits for (release.yml still releases the Electron app). The packages
# each build made are kept a week, to try.
name: Tauri

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Rust, as the runners have rustup.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # What Tauri builds against on Linux: WebKitGTK and GTK; rpm, for its .rpm package.
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf rpm file
      - run: pnpm install --frozen-lockfile
      # What it carries (the web client, Node, git, pandoc and Typst), then the app: for the tests on macOS, for release elsewhere.
      - run: pnpm --filter @kuraa/tauri stage
      - if: matrix.name == 'macos'
        run: node apps/tauri/scripts/build.mjs --test
      - if: matrix.name != 'macos'
        run: node apps/tauri/scripts/build.mjs
      - if: matrix.name == 'macos'
        run: git config --global user.name "kuraa CI" && git config --global user.email "ci@kuraa.invalid"
      - if: matrix.name == 'macos'
        run: pnpm test:e2e --project tauri
        env:
          KURAA_TAURI_BUILT: '1'
      - if: failure() && matrix.name == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tauri-test-results
          path: test-results/
          retention-days: 7
      - if: matrix.name != 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kuraa-tauri-${{ matrix.name }}
          path: |
            apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/tauri/src-tauri/target/release/bundle/rpm/*.rpm
            apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
