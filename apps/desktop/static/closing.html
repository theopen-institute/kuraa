<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Kuraa</title>
  <!-- Shown as the app quits (or restarts to update) while its workspaces stop (0131): their edits saved on this
       computer first, then what is still to go sent to the other devices and online copies, a while at most. Once
       everything is saved, Quit Now stops the waiting: what was not sent goes the next time Kuraa opens. -->
  <style>
    :root { --bg: #fbfaf8; --text: #1d1c1a; --muted: #635f58; --accent: #2f6f5e; --line: #d9d5cd; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171716; --text: #e8e6e1; --muted: #a5a198; --accent: #7cc4ad; --line: #3a3935; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
    main { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0.03em; }
    p { margin: 0; color: var(--muted); max-width: 30em; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin-top: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    .later { display: grid; gap: 6px; justify-items: center; margin-top: 14px; visibility: hidden; }
    button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 14px; cursor: default; }
    button:hover { border-color: var(--muted); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint { font-size: 12.5px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Closing Kuraa</h1>
    <p id="what" role="status">Saving your work…</p>
    <div class="spinner" aria-hidden="true"></div>
    <div class="later" id="later">
      <button type="button" id="now">Quit Now</button>
      <p class="hint">Anything not sent yet goes the next time Kuraa opens.</p>
    </div>
  </main>
  <script>
    const restart = new URLSearchParams(location.search).has('restart');
    if (restart) {
      document.getElementById('title').textContent = 'Restarting Kuraa';
      document.getElementById('now').textContent = 'Restart Now';
    }
    const bridge = window.kuraaClosing;
    bridge?.onSaved(() => {
      document.getElementById('what').textContent = 'Your work is saved. Sending the latest to your other devices and online copies…';
      // Not at once: most of the time that is done within a second, and the button would only flash.
      setTimeout(() => { document.getElementById('later').style.visibility = 'visible'; }, 1500);
    });
    document.getElementById('now').addEventListener('click', () => bridge?.quitNow());
  </script>
</body>
</html>
