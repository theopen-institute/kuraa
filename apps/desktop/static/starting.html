<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Kuraa</title>
  <!-- Shown at once while the app's host starts (its workspaces open, and it finds their other devices), so the
       window is never blank. The workspaces replace it as soon as they are ready. -->
  <style>
    :root { --bg: #fbfaf8; --text: #1d1c1a; --muted: #635f58; --accent: #2f6f5e; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171716; --text: #e8e6e1; --muted: #a5a198; --accent: #7cc4ad; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
    main { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0.03em; }
    p { margin: 0; color: var(--muted); max-width: 30em; }
    .slow { visibility: hidden; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin-top: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Kuraa</h1>
    <p>Opening your workspaces…</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="slow" id="slow">Still starting. Networks that block connections between computers (some school and office networks) make this slower; your files are safe.</p>
  </main>
  <script>
    setTimeout(() => { document.getElementById('slow').style.visibility = 'visible'; }, 5000);
  </script>
</body>
</html>
