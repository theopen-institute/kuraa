[package]
name = "kuraa"
version = "0.0.0"
description = "Kuraa's desktop app: the web client in the system's webview, the host in the Node it carries (decision 0127)"
edition = "2021"
publish = false

[features]
# Driving the app from the desktop tests (src/testing.rs): never in a release.
test-control = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
rfd = "0.15"
serde_json = "1"
base64 = "0.22"
url = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSUserDefaults", "NSArray", "NSRange", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = ["NSSpellChecker"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
